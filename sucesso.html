<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pedido Confirmado — Tolent Imports</title>
  <link rel="icon" type="image/png" href="images/new_logo.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; padding:40px 20px; }
    .success-card {
      max-width: 520px;
      width: 100%;
      text-align: center;
      border: 1px solid rgba(201,169,110,.22);
      padding: 60px 48px;
      background: #0d0d0d;
    }
    .success-icon { font-size: 52px; margin-bottom: 24px; }
    .success-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 32px;
      font-weight: 300;
      color: #c9a96e;
      letter-spacing: 2px;
      margin-bottom: 16px;
    }
    .success-text {
      font-family: 'Montserrat', sans-serif;
      font-size: 13px;
      font-weight: 300;
      color: rgba(245,245,240,.65);
      line-height: 1.8;
      margin-bottom: 40px;
    }
    .success-text strong { color: #f4f4ef; font-weight: 500; }
    .btn-back {
      display: inline-block;
      font-family: 'Montserrat', sans-serif;
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: #070707;
      background: #c9a96e;
      padding: 14px 32px;
      text-decoration: none;
      transition: opacity .2s;
    }
    .btn-back:hover { opacity: .85; }
  </style>
</head>
<body>
  <div class="success-card">
    <div class="success-icon">✓</div>
    <h1 class="success-title">Pedido Confirmado</h1>
    <p class="success-text">
      Seu pagamento foi <strong>recebido com sucesso</strong>.<br />
      Em breve entraremos em contato pelo WhatsApp para confirmar
      os detalhes e o prazo de entrega.<br /><br />
      Obrigado por escolher a <strong>Tolent Imports</strong>.
    </p>
    <a href="/" class="btn-back">Continuar Comprando</a>
  </div>
</body>
</html>
